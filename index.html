<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ROI Studio - VLauncher</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="app">

    <!-- Landing -->
    <section id="screen-landing" class="screen active">
      <h1>ROI Assessment for ChromeOS + VLauncher</h1>
      <p>Estimate cost savings and operational impact based on your environment.</p>

      <button id="start-btn">Start ROI Assessment</button>

      <p class="trust">No email required. Adjust every assumption.</p>

      <div class="ga-banner">
        <h3>Join the VLauncher GA waitlist</h3>
        <input type="email" placeholder="Work email" />
        <button>Join</button>
      </div>
    </section>

    <!-- Context -->
    <section id="screen-context" class="screen">
      <h2>Context</h2>
      <div id="context-form"></div>
      <div class="nav-row">
        <button id="to-landing">Back</button>
        <button id="to-usage">Next</button>
      </div>
    </section>

    <!-- Usage -->
    <section id="screen-usage" class="screen">
      <h2>Usage & Productivity</h2>
      <div id="usage-form"></div>
      <div class="nav-row">
        <button id="to-context">Back</button>
        <button id="to-operations">Next</button>
      </div>
    </section>

    <!-- Operations -->
    <section id="screen-operations" class="screen">
      <h2>Operations & Cost</h2>
      <div id="operations-form"></div>
      <div class="nav-row">
        <button id="to-usage-back">Back</button>
        <button id="to-results">Calculate</button>
      </div>
    </section>

    <!-- Results -->
    <section id="screen-results" class="screen">
      <h2>Results</h2>
      <div id="results-container"></div>
      <button id="edit-inputs">Edit Inputs</button>
    </section>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
