<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ROI Studio - VLauncher</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">

    <section id="screen-landing" class="screen active">
      <h1>ROI Assessment for ChromeOS + VLauncher</h1>
      <p>Estimate cost savings and operational impact based on your environment.</p>

      <button id="start-btn" type="button">Start ROI Assessment</button>

      <p class="trust">No email required. Adjust every assumption.</p>

      <div class="ga-banner">
        <h3>Join the VLauncher GA waitlist</h3>
        <input type="email" placeholder="Work email" />
        <button type="button">Join</button>
      </div>
    </section>

    <section id="screen-context" class="screen">
      <div class="app-shell">
        <div class="main-panel">
          <div id="stepper"></div>
          <h2>Context</h2>
          <div id="context-form"></div>
          <div class="nav-row">
            <button id="to-usage" type="button">Next</button>
          </div>
        </div>
        <aside class="side-panel">
          <div id="summary-panel"></div>
        </aside>
      </div>
    </section>

    <section id="screen-usage" class="screen">
      <div class="app-shell">
        <div class="main-panel">
          <div id="stepper"></div>
          <h2>Usage & Productivity</h2>
          <div id="usage-form"></div>
          <div class="nav-row">
            <button id="back-to-context" type="button">Back</button>
            <button id="to-operations" type="button">Next</button>
          </div>
        </div>
        <aside class="side-panel">
          <div id="summary-panel"></div>
        </aside>
      </div>
    </section>

    <section id="screen-operations" class="screen">
      <div class="app-shell">
        <div class="main-panel">
          <div id="stepper"></div>
          <h2>Operations & Cost</h2>
          <div id="operations-form"></div>
          <div class="nav-row">
            <button id="back-to-usage" type="button">Back</button>
            <button id="to-results" type="button">Calculate</button>
          </div>
        </div>
        <aside class="side-panel">
          <div id="summary-panel"></div>
        </aside>
      </div>
    </section>

    <section id="screen-results" class="screen">
      <div class="app-shell">
        <div class="main-panel">
          <div id="stepper"></div>
          <h2>Results</h2>
          <div id="results-container"></div>
          <div class="nav-row">
            <button id="edit-inputs" type="button">Edit Inputs</button>
          </div>
        </div>
        <aside class="side-panel">
          <div id="summary-panel"></div>
        </aside>
      </div>
    </section>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
